name: Azure - Blue Green Deploy to AKS

on:
  workflow_dispatch:
    inputs:
      active_version:
        description: Active version to route traffic to after deployment
        required: true
        default: blue
        type: choice
        options:
          - blue
          - green

env:
  RESOURCE_GROUP: rg-ecommerce-bluegreen-dev
  LOCATION: uksouth
  ACR_NAME: acrecommercebg8070
  AKS_NAME: aks-ecommerce-bluegreen-dev
  IMAGE_NAME: ecommerce-app
  BLUE_TAG: v1.0.0-blue
  GREEN_TAG: v2.0.0-green

jobs:
  build-push-deploy:
    name: Build, push, deploy, and switch traffic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set ACR login server
        run: |
          ACR_LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query loginServer \
            --output tsv)
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build Blue image
        run: |
          docker build \
            -f server/Dockerfile \
            --build-arg APP_VERSION=v1.0.0 \
            --build-arg APP_ENV=blue \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$BLUE_TAG" \
            ./server

      - name: Build Green image
        run: |
          docker build \
            -f server/Dockerfile \
            --build-arg APP_VERSION=v2.0.0 \
            --build-arg APP_ENV=green \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$GREEN_TAG" \
            ./server

      - name: Scan Blue image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.BLUE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan Green image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.GREEN_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Push Blue image to ACR
        run: docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$BLUE_TAG"

      - name: Push Green image to ACR
        run: docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$GREEN_TAG"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --overwrite-existing

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/aks/namespace.yaml
          kubectl apply -f k8s/aks/postgres.yaml
          kubectl apply -f k8s/aks/blue-deployment.yaml
          kubectl apply -f k8s/aks/green-deployment.yaml
          kubectl apply -f k8s/aks/service.yaml

      - name: Wait for application rollouts
        run: |
          kubectl rollout status deployment/ecommerce-postgres -n ecommerce-bluegreen --timeout=300s
          kubectl rollout status deployment/ecommerce-blue -n ecommerce-bluegreen --timeout=300s
          kubectl rollout status deployment/ecommerce-green -n ecommerce-bluegreen --timeout=300s

      - name: Switch active version
        run: |
          kubectl patch service ecommerce-service \
            -n ecommerce-bluegreen \
            -p "{\"spec\":{\"selector\":{\"app\":\"ecommerce\",\"version\":\"${{ github.event.inputs.active_version }}\"}}}"

      - name: Validate active version
        run: |
          kubectl run gha-curl-validation \
            -n ecommerce-bluegreen \
            --image=curlimages/curl:8.11.1 \
            --restart=Never \
            --rm -i \
            --command -- sh -c '
              response=$(curl -s http://ecommerce-service/api/v1/version)
              echo "$response"
              echo "$response" | grep "\"environment\":\"${{ github.event.inputs.active_version }}\""
            '

      - name: Install NGINX Ingress Controller
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update

          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --set controller.replicaCount=2 \
            --set-string controller.service.annotations."service\\.beta\\.kubernetes\\.io/azure-load-balancer-health-probe-request-path"=/healthz

      - name: Wait for NGINX Ingress Controller
        run: |
          kubectl rollout status deployment/ingress-nginx-controller \
            -n ingress-nginx \
            --timeout=300s

          kubectl get pods -n ingress-nginx -o wide
          kubectl get svc ingress-nginx-controller -n ingress-nginx -o wide

      - name: Apply ecommerce Ingress
        run: |
          kubectl apply -f k8s/aks/ingress.yaml
          kubectl get ingress ecommerce-ingress -n ecommerce-bluegreen -o wide
          kubectl describe ingress ecommerce-ingress -n ecommerce-bluegreen

      - name: Wait for Azure public LoadBalancer IP
        run: |
          for i in {1..30}; do
            INGRESS_IP=$(kubectl get svc ingress-nginx-controller \
              -n ingress-nginx \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$INGRESS_IP" ]; then
              echo "INGRESS_IP=$INGRESS_IP" >> "$GITHUB_ENV"
              echo "Azure public LoadBalancer IP: $INGRESS_IP"
              exit 0
            fi

            echo "Waiting for Azure public LoadBalancer IP..."
            sleep 20
          done

          echo "Timed out waiting for Azure public LoadBalancer IP"
          kubectl get svc ingress-nginx-controller -n ingress-nginx -o wide
          exit 1

      - name: Validate public Ingress route
        run: |
          echo "Testing public Ingress at http://$INGRESS_IP/api/v1/version"
          response=$(curl -s --connect-timeout 20 \
            -H "Host: ecommerce-aks.local" \
            "http://$INGRESS_IP/api/v1/version")

          echo "$response"
          echo "$response" | grep "\"environment\":\"${{ github.event.inputs.active_version }}\""

          echo "Testing public metrics endpoint"
          curl -s --connect-timeout 20 \
            -H "Host: ecommerce-aks.local" \
            "http://$INGRESS_IP/api/v1/metrics" | grep ecommerce_app_info

      - name: Show final Kubernetes state
        run: |
          kubectl get all -n ecommerce-bluegreen -o wide
          kubectl get endpoints ecommerce-service -n ecommerce-bluegreen -o wide
